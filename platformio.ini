; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; platform バージョン固定 (UDP telemetry Phase1 計画書 §3.1 ゲート1第9回・第10回指摘対応):
; 本設計の Wi-Fi 安全ガード (src/core/wifi_guard.h) は arduino-esp32 の
; WiFiGeneric.cpp::_eventCallback() の first_connect one-shot 挙動 (非自発的切断の
; 初回で無条件 disconnect();begin();、ASSOC_LEAVE 除外) に依存する。
; 2026-07-05 実装時に `pio pkg list -e m5stack-core2` で実解決を確認:
;   espressif32 @ 6.12.0 → framework-arduinoespressif32 @ 3.20017.241212+sha.dcc1105b
; 該当ロジック (WiFiGeneric.cpp:1034-1094) は framework-arduinoespressif32@3.20016.0
; (旧検証時のソース) と diff で同一であることを確認済み。platform 更新時は
; scripts/verify_builds.sh が両バージョンを assert し、不一致なら fail する
; (one-shot 挙動の再確認を強制するため)。
[env:m5stack-core2]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
	robotis-git/Dynamixel2Arduino@^0.8.1
	m5stack/M5Unified@^0.2.7
	meganetaaan/M5Stack-Avatar@^0.9.2
test_ignore = test_core
; UDP telemetry Phase1 計画書 §3.1: ビルド時に git 短縮ハッシュを -DBSL_FW_GIT として
; 注入する (schema v1 の "fw" フィールド。実験ログと firmware 版数の突合用)。
build_flags =
	!python3 scripts/git_fw_hash.py

; 純ロジック層 (src/core/) のホスト実行ユニットテスト (設計書 §8)
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17 -Wall -Wextra
